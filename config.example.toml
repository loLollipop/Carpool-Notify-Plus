# Carpool Notify 配置示例
# 复制为 config.toml 后填写真实值：
#   cp config.example.toml config.toml
#
# 优先级：环境变量（若设置）> config.toml > 默认值
# 配置文件路径：-config /path/to/config.toml  或  CARPOOL_CONFIG  或  ./config.toml

[server]
# 监听地址
listen = ":8080"
# SQLite 数据库路径
db_path = "./data/carpool.db"
# 登录密码（必填，至少 8 个字符；建议使用密码管理器生成的长随机密码）
# 示例占位值 change-me 不可用于启动，请填写自己的密码。
password = ""
# Session 签名密钥（必填，至少 32 字节；建议生成 32 随机字节并编码为十六进制）
# 示例占位值 change-me-to-a-long-random-string 不可用于启动。
# 更换密钥会使现有登录会话失效；不要把此密钥提交到版本库。
session_secret = ""
# HTTPS 部署必须保持 true；仅在本机通过 HTTP 调试时显式改为 false
session_cookie_secure = true

[gotify]
# Gotify 服务根地址，不要末尾斜杠，不要带 /message
# 例：https://gotify.example.com
url = ""
# Gotify Application Token
token = ""

[iyuu]
# IYUU 令牌（https://iyuu.cn/）
token = ""

[smtp]
# SMTP 主机与端口（常用 587 STARTTLS）
host = ""
port = 587
username = ""
password = ""
# 发件人地址
from = ""
# 运营收钱提醒固定收件人（逗号分隔多个）；给客户发信时用订阅上的客户邮箱
to = ""
