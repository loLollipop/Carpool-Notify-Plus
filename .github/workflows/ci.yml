name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test backend
        run: go test ./...
      - name: Vet backend
        run: go vet ./...
      - name: Check unused backend code
        run: |
          unused=$(go run golang.org/x/tools/cmd/deadcode@v0.29.0 -test -filter '^carpool-notify/' ./cmd/... ./internal/... ./scripts/...)
          if [ -n "$unused" ]; then
            printf '%s\n' "$unused"
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Test frontend
        run: npm test
      - name: Build frontend
        run: npm run build
